apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: janus
  labels:
    app: janus
rules:
  # EndpointSlice discovery for service auto-discovery.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: janus
  labels:
    app: janus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: janus
subjects:
  - kind: ServiceAccount
    name: janus
    namespace: {{ .Release.Namespace }}
